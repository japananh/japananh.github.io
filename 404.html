<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Violet Tran</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070b16">
  <script>
    // Old Hugo blog lived at the site root; forward those URLs to /blog.
    (function () {
      var p = location.pathname;
      var old = ["/p/", "/post/", "/tags/", "/categories/", "/archives/", "/page/", "/search/", "/about/", "/img/", "/scss/", "/ts/"];
      var hit = p === "/index.xml" || p === "/sitemap.xml" || old.some(function (r) { return p.indexOf(r) === 0; });
      if (hit) location.replace("/blog" + p + location.search + location.hash);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-content: center; justify-items: start; gap: 18px; padding: 48px var(--gutter); position: relative; z-index: 1; }
    .nf-code { font: 500 14px/1 var(--f-mono); color: var(--cyan); letter-spacing: 0.08em; }
    .nf h1 { font: 700 clamp(36px, 7vw, 64px)/1.1 var(--f-display); }
    .nf p { color: var(--text-dim); max-width: 46ch; }
    .nf .cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="glow on" aria-hidden="true"></div>
  <main class="nf">
    <span class="nf-code">404</span>
    <h1>Page not found</h1>
    <p>That page doesn't exist or has moved. Try the portfolio or the blog.</p>
    <div class="cta-row">
      <a class="btn btn-solid" href="/">Portfolio</a>
      <a class="btn btn-line" href="/blog/">Blog</a>
    </div>
  </main>
</body>
</html>
